name: webhook-guard

x-app-env: &app-env
  HTTP_ADDR: ":8080"
  DATABASE_URL: postgres://${POSTGRES_USER:-webhook}:${POSTGRES_PASSWORD:-webhook}@postgres:5432/${POSTGRES_DB:-webhook_guard}?sslmode=disable
  WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-whsec_dev_change_me}
  SIGNATURE_TOLERANCE: ${SIGNATURE_TOLERANCE:-5m}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webhook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webhook}
      POSTGRES_DB: ${POSTGRES_DB:-webhook_guard}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-webhook}:${POSTGRES_PASSWORD:-webhook}@postgres:5432/${POSTGRES_DB:-webhook_guard}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    environment: *app-env
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  app-naive:
    profiles: ["naive"]
    build:
      context: .
      target: runtime
      args:
        TAGS: naive
    environment: *app-env
    ports:
      - "${HTTP_PORT_NAIVE:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  loadgen:
    profiles: ["load"]
    build:
      context: .
      target: runtime
    entrypoint: ["loadgen"]
    environment:
      LOADGEN_TARGET: ${LOADGEN_TARGET:-http://app:8080}
      LOADGEN_WEBHOOK_SECRET: ${WEBHOOK_SIGNING_SECRET:-whsec_dev_change_me}
    depends_on:
      app:
        condition: service_started
    restart: "no"

volumes:
  pgdata:
